name: SDL desktop build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Windows SDK and linker environment
        uses: ilammy/msvc-dev-cmd@v1
      - name: Configure with Ninja and Clang
        run: cmake --preset windows-clang
      - name: Build
        run: cmake --build --preset windows-clang
      - name: Test the application and install
        run: ctest --preset windows-clang
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Clang, Ninja, and SDL desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-19 libstdc++-13-dev cmake ninja-build pkg-config \
            libx11-dev libxext-dev libxcursor-dev libxfixes-dev libxi-dev libxrandr-dev \
            libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev libdecor-0-dev \
            libgl-dev libegl-dev libasound2-dev libpulse-dev libdbus-1-dev
      - name: Configure with Ninja and Clang
        run: cmake --preset linux-clang -DCMAKE_C_COMPILER=clang-19 -DCMAKE_CXX_COMPILER=clang++-19
      - name: Build
        run: cmake --build --preset linux-clang
      - name: Test the application and install
        run: ctest --preset linux-clang
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
