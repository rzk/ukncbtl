name: PVS-Studio analysis

on: workflow_dispatch

defaults:
  run:
    shell: cmd

jobs:
  build-analyze:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Download PVS Studio
        uses: suisei-cn/actions-download-file@v1.3.0
        with:
          url: https://files.pvs-studio.com/PVS-Studio_setup.exe
          target: .\Distrib
      - name: Install PVS Studio
        run: |
          .\Distrib\PVS-Studio_setup.exe /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /COMPONENTS=Core
      - name: Configure PVS Studio
        run: |
          "C:\Program Files (x86)\PVS-Studio\PVS-Studio_Cmd.exe" credentials -u ${{ secrets.PVS_STUDIO_USERNAME }} -n ${{ secrets.PVS_STUDIO_KEY }}
      - name: Set up Windows SDK and linker environment
        uses: ilammy/msvc-dev-cmd@v1
      - name: Configure CMake
        run: cmake --preset windows-clang -DBUILD_TESTING=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Build
        run: cmake --build --preset windows-clang
      - name: Run PVS Studio
        run: |
          mkdir Results
          "C:\Program Files (x86)\PVS-Studio\CompilerCommandsAnalyzer.exe" analyze -f .\build\windows-clang\compile_commands.json -e .\build\windows-clang\_deps -e .\third_party -o .\Results\UKNCBTL.log
        continue-on-error: true
      - name: Convert the report
        run: |
          "C:\Program Files (x86)\PVS-Studio\PlogConverter.exe" -t Html,Totals -o .\Results\ -d V536,V1042 .\Results\UKNCBTL.log
      - name: Upload the report
        uses: actions/upload-artifact@v3
        with:
          name: UKNCBTL-PVS
          path: .\Results\
