image: Visual Studio 2022

configuration:
  - Debug
  - Release

environment:
  matrix:
    - UKNCBTL_ENABLE_ASAN: "OFF"
    - UKNCBTL_ENABLE_ASAN: "ON"

matrix:
  exclude:
    - configuration: Debug
      UKNCBTL_ENABLE_ASAN: "ON"

build_script:
  - for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
  - cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=%CONFIGURATION% -DUKNCBTL_BUILD_LEGACY=ON -DUKNCBTL_ENABLE_IMGUI=OFF -DUKNCBTL_ENABLE_SDL3=OFF -DUKNCBTL_ENABLE_ASAN=%UKNCBTL_ENABLE_ASAN%
  - cmake --build build --parallel

test_script:
  - ctest --test-dir build --output-on-failure
